<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo for Two</title>
<meta name="theme-color" content="#14161c">
<style>
  :root { --bg:#14161c; --panel:#1e222b; --ink:#eef0f4; --mute:#9aa3b2; --line:#2e3441; --accent:#ffb300; --rose:#ffb300; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); font:16px/1.45 system-ui,'Segoe UI',Roboto,sans-serif; display:flex; justify-content:center;
         padding:16px; min-height:100vh; overflow-x:hidden;
         background:#14161c; }
  main { width:100%; max-width:560px; position:relative; z-index:1; }
  h1 { font-size:1.5rem; font-weight:700; text-align:center; margin:8px 0 14px; letter-spacing:.3px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;
          box-shadow:none; }
  button { font:inherit; font-weight:600; color:#111; background:var(--accent); border:0; border-radius:10px; padding:11px 18px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:0; font:inherit; color:var(--ink); background:#1f071380; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .mute { color:var(--mute); font-size:.95rem; }
  #game { display:none; }
  #board { width:100%; aspect-ratio:1; display:block; border-radius:12px; touch-action:manipulation; border:2px solid #2e3441; }
  #bar { display:flex; justify-content:space-between; gap:8px; margin-bottom:10px; font-size:.95rem; color:var(--mute); }
  #dock { display:flex; align-items:center; gap:14px; margin-top:16px; }
  #scene { width:84px; height:84px; perspective:420px; flex:none; display:grid; place-items:center; }
  #cube { width:56px; height:56px; position:relative; transform-style:preserve-3d; transition:transform 1.1s cubic-bezier(.15,.7,.25,1); }
  #scene.hop { animation:hop 1.1s cubic-bezier(.3,0,.3,1); }
  @keyframes hop { 0%{transform:translateY(0)} 25%{transform:translateY(-22px)} 55%{transform:translateY(0)} 70%{transform:translateY(-7px)} 85%{transform:translateY(0)} 93%{transform:translateY(-2px)} 100%{transform:translateY(0)} }
  .face { position:absolute; inset:0; border-radius:11px; background:linear-gradient(145deg,#fff,#f1d9e0); border:1px solid #d9b3c0;
          display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:7px; backface-visibility:hidden; }
  .face i { width:100%; height:100%; border-radius:50%; }
  .face i.p { background:radial-gradient(circle at 35% 30%,#444,#111); box-shadow:inset 0 1px 2px #0006; margin:auto; width:78%; height:78%; }
  #cube .f1 { transform:rotateY(0deg) translateZ(28px); } #cube .f2 { transform:rotateY(90deg) translateZ(28px); }
  #cube .f3 { transform:rotateX(90deg) translateZ(28px); } #cube .f4 { transform:rotateX(-90deg) translateZ(28px); }
  #cube .f5 { transform:rotateY(-90deg) translateZ(28px); } #cube .f6 { transform:rotateY(180deg) translateZ(28px); }
  #timer { height:10px; border-radius:99px; background:#1f071399; border:1px solid var(--line); margin-top:14px; position:relative; overflow:hidden; display:none; }
  #timer i { position:absolute; left:0; top:0; bottom:0; width:100%; background:#ffb300; border-radius:99px; }
  #timer.low i { background:#ff3b5c; }
  #tt { display:none; margin-top:6px; color:var(--mute); font-size:.95rem; text-align:center; }
  #msg { flex:1; font-weight:600; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:#777; }
  .dot.on { background:#43a047; }
  #win { display:none; text-align:center; font-size:1.2rem; font-weight:700; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Ludo for Two</h1>

  <section id="lobby" class="card">
    <p style="margin-top:0">Start a game and send the link to the other player. No sign up, nothing to install.</p>
    <div class="row" style="margin-bottom:12px"><input type="text" id="myName" maxlength="14" placeholder="Your name"></div>
    <div class="row">
      <button id="newBtn">Start a new game</button>
      <button id="joinBtn" style="display:none">Join the game</button>
      <button id="resumeBtn" class="ghost" style="display:none">Resume my last game</button>
    </div>
  </section>

  <section id="share" class="card" style="display:none">
    <div class="mute" style="margin-bottom:8px">Send this link to the other player. Keep this page open until they join.</div>
    <div class="row">
      <input type="text" id="link" readonly>
      <button id="copyBtn">Copy</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="waBtn" class="ghost">Send on WhatsApp</button>
    </div>
  </section>

  <section id="game">
    <div id="bar"><span id="who"></span><span id="conn"></span></div>
    <canvas id="board" width="900" height="900"></canvas>
    <div id="dock">
      <div id="scene"><div id="cube"></div></div>
      <div id="msg"></div>
      <button id="rollBtn" disabled>Roll</button>
    </div>
    <div id="timer"><i></i></div><div id="tt"></div>
    <div class="row" style="margin-top:12px">
      <button id="againBtn" class="ghost" style="display:none">Play again</button>
    <div id="win"></div>
    </div>
  </section>

  <p class="mute" id="status"></p>
</main>

<script src="peerjs.min.js?v=8"></script>
<script src="game.js?v=8"></script>
<script>
(function () {
  const L = window.Ludo;
  const VERSION = '8';
  const PREFIX = 'sizwe-ludo-';
  const ICE = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' },
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turns:openrelay.metered.ca:443?transport=tcp'],
      username: 'openrelayproject', credential: 'openrelayproject' }
  ] };

  const $ = (id) => document.getElementById(id);
  const cv = $('board'), ctx = cv.getContext('2d');
  let S = L.newState();
  let peer = null, conn = null, isHost = false, code = '', mySeat = 0, peerHere = false;
  let shownSeq = -1;
  const TURN_MS = 10000;
  let tmr = null, deadline = null, spin = 0;
  const vis = { 0: [0, 0, 0, 0], 2: [0, 0, 0, 0] };  // progress as drawn, walks towards the real one
  let lastT = 0;
  const names = { 0: 'Red', 2: 'Yellow' };
  const myNameEl = () => ($('myName').value.trim() || (isHost ? 'Red' : 'Yellow')).slice(0, 14);
  const nm = (seat) => names[seat] || L.NAMES[seat];

  function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function say(t) { $('status').textContent = t || ''; }

  function randCode() {
    const a = 'abcdefghjkmnpqrstuvwxyz23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }

  // ---------- networking ----------
  function showGame() {
    $('lobby').style.display = 'none';
    $('game').style.display = 'block';
    $('who').innerHTML = 'Playing as <b style="color:' + L.COLORS[mySeat] + '"></b>';
    $('who').querySelector('b').textContent = nm(mySeat);
    render();
  }

  function setConn(on) {
    peerHere = on;
    if (isHost && !on) { clearTimeout(tmr); deadline = null; }
    $('conn').innerHTML = '<span class="dot' + (on ? ' on' : '') + '"></span>' + (on ? 'Connected' : 'Waiting for opponent');
    render();
  }

  function startHost(c, resumeState) {
    isHost = true; mySeat = 0; code = c; names[0] = myNameEl();
    if (resumeState) S = resumeState;
    peer = new Peer(PREFIX + code, { config: ICE });
    peer.on('open', () => {
      const link = location.origin + location.pathname + '#' + code;
      $('link').value = link;
      $('share').style.display = 'block';
      store('ludo-host', { code, S });
      say('');
      showGame();
      setConn(false);
    });
    peer.on('connection', (c2) => {
      if (conn && conn.open) { c2.close(); return; }
      conn = c2;
      c2.on('open', () => { setConn(true); $('share').style.display = 'none'; sync(); });
      c2.on('data', onGuestMsg);
      c2.on('close', () => { setConn(false); say('Your opponent left. They can rejoin with the same link.'); });
      c2.on('error', () => setConn(false));
    });
    peer.on('error', (e) => {
      if (e.type === 'unavailable-id') { say('That game code is already in use. Starting a fresh one.'); peer.destroy(); startHost(randCode(), null); }
      else say('Connection problem: ' + e.type);
    });
  }

  function startGuest(c) {
    isHost = false; mySeat = 2; code = c;
    $('lobby').style.display = 'none';
    say('Connecting...');
    peer = new Peer(undefined, { config: ICE });
    peer.on('open', () => {
      conn = peer.connect(PREFIX + code, { reliable: true });
      const t = setTimeout(() => { if (!peerHere) say('Could not reach the host. Ask them to keep their page open, then reload this one.'); }, 20000);
      conn.on('open', () => { clearTimeout(t); say(''); showGame(); setConn(true); send({ t: 'hello', name: myNameEl() }); });
      conn.on('data', (m) => { if (m && m.t === 'state' && m.v !== VERSION) {
        // This page is an older copy than the host's, so fetch the current one.
        say('Updating to the latest version...');
        let tried = false; try { tried = sessionStorage.getItem('ludo-upd') === m.v; sessionStorage.setItem('ludo-upd', m.v || 'x'); } catch (e) {}
        if (!tried) location.replace(location.pathname + '?v=' + (m.v || Date.now()) + location.hash);
        else say('Your page is out of date. Refresh it with Ctrl+Shift+R.');
        return;
      }
      if (m && m.t === 'state') { S = m.s; if (m.n) Object.assign(names, m.n); deadline = m.ms ? Date.now() + m.ms : null; render(); } });
      conn.on('close', () => { setConn(false); say('Disconnected from the host. Reload this page to rejoin.'); });
    });
    peer.on('error', (e) => say(e.type === 'peer-unavailable'
      ? 'That game was not found. Ask your partner to start a new one and send a fresh link.'
      : 'Connection problem: ' + e.type));
  }

  function send(m) { if (conn && conn.open) conn.send(m); }

  function armTimer() {
    clearTimeout(tmr); deadline = null;
    if (isHost && peerHere && S.winner == null && !S.passing) {
      deadline = Date.now() + TURN_MS;
      tmr = setTimeout(onTimeout, TURN_MS);
    }
  }

  // Host only: nobody decided in time, so play for them.
  function onTimeout() {
    if (S.winner != null || S.passing) return;
    const seat = S.turn;
    if (S.dice == null) L.roll(S, seat);
    else L.move(S, seat, L.autoPick(S, seat));
    S.msg = 'Time ran out. ' + S.msg;
    sync();
    if (S.passing) setTimeout(() => { L.nextTurn(S); sync(); }, 2300);
  }

  function sync() {
    if (isHost) {
      armTimer();
      store('ludo-host', { code, S });
      send({ t: 'state', s: S, n: names, ms: deadline ? TURN_MS : null, v: VERSION });
    }
    render();
  }

  function onGuestMsg(m) {
    if (!isHost || !m) return;
    if (m.t === 'hello') { names[2] = String(m.name || 'Yellow').slice(0, 14); sync(); }
    else if (m.t === 'roll') hostRoll(2);
    else if (m.t === 'move') hostMove(2, m.i);
    else if (m.t === 'again') hostAgain();
  }

  // ---------- host-side actions ----------
  function hostRoll(seat) {
    if (!L.roll(S, seat)) return;
    sync();
    if (S.passing) setTimeout(() => { L.nextTurn(S); sync(); }, 2300);
  }
  function hostMove(seat, i) { if (L.move(S, seat, i)) sync(); }
  function hostAgain() { if (S.winner != null) { S = L.newState(); sync(); } }

  function act(kind, i) {
    if (isHost) {
      if (kind === 'roll') hostRoll(mySeat);
      else if (kind === 'move') hostMove(mySeat, i);
      else hostAgain();
    } else send({ t: kind, i });
  }

  // ---------- UI ----------
  const FACES = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  function render() {
    const mine = S.turn === mySeat && S.winner == null;
    $('msg').textContent = S.msg.replace(/\bRed\b/g, nm(0)).replace(/\bYellow\b/g, nm(2)) + (mine && S.dice == null && !S.passing ? ' (your turn)' : '');
    $('rollBtn').disabled = !(peerHere && mine && S.dice == null && !S.passing);
    $('againBtn').style.display = S.winner != null ? 'inline-block' : 'none';
    $('win').style.display = S.winner != null ? 'block' : 'none';
    if (S.winner != null) $('win').textContent = nm(S.winner) + ' wins the game';
    if (S.seq !== shownSeq) {
      shownSeq = S.seq;
      if (S.dice) tumble(S.dice);
    }
  }

  // 3D dice: face n comes to the front by the inverse of where it sits on the cube.
  const FACE_ROT = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  (function buildCube() {
    const cube = $('cube');
    for (let n = 1; n <= 6; n++) {
      const f = document.createElement('div'); f.className = 'face f' + n;
      for (let k = 0; k < 9; k++) { const d = document.createElement('i'); if (PIPS[n].includes(k)) d.className = 'p'; f.appendChild(d); }
      cube.appendChild(f);
    }
    cube.style.transform = 'rotateX(-25deg) rotateY(-30deg)';
  })();
  function tumble(n) {
    spin += 2;
    const r = FACE_ROT[n];
    $('cube').style.transform = 'rotateX(' + (r[0] + 360 * spin) + 'deg) rotateY(' + (r[1] + 360 * spin) + 'deg)';
    const sc = $('scene'); sc.classList.remove('hop'); void sc.offsetWidth; sc.classList.add('hop');
  }

  // ---------- drawing ----------
  const BASE_ORIGIN = [[0, 0], [9, 0], [9, 9], [0, 9]];
  const SLOT = [[2, 2], [4, 2], [2, 4], [4, 4]];
  const DIR = [[-1, 0], [0, -1], [1, 0], [0, 1]];

  function tokenPos(seat, i, p) {
    if (p === 0) { const o = BASE_ORIGIN[seat]; return [o[0] + SLOT[i][0], o[1] + SLOT[i][1]]; }
    if (p <= 51) { const c = L.TRACK[L.trackIdx(seat, p)]; return [c[0] + .5, c[1] + .5]; }
    if (p < L.DONE) { const c = L.HOME[seat][p - 52]; return [c[0] + .5, c[1] + .5]; }
    const d = DIR[seat], perp = [-d[1], d[0]];
    return [7.5 + d[0] * .85 + perp[0] * (i - 1.5) * .28, 7.5 + d[1] * .85 + perp[1] * (i - 1.5) * .28];
  }

  function star(x, y, r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function tint(hex, a) { return hex + Math.round(a * 255).toString(16).padStart(2, '0'); }

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function arrow(cx, cy, dx, dy, col, u) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(dy, dx));
    ctx.beginPath();
    ctx.moveTo(-.28 * u, -.09 * u); ctx.lineTo(.02 * u, -.09 * u); ctx.lineTo(.02 * u, -.22 * u); ctx.lineTo(.3 * u, 0);
    ctx.lineTo(.02 * u, .22 * u); ctx.lineTo(.02 * u, .09 * u); ctx.lineTo(-.28 * u, .09 * u); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.restore();
  }

  function drawBoard(u) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 15 * u, 15 * u);
    // corner bases: colour block, soft gloss, white panel, four pawn pads
    BASE_ORIGIN.forEach((o, s) => {
      ctx.fillStyle = L.COLORS[s]; ctx.fillRect(o[0] * u, o[1] * u, 6 * u, 6 * u);
      const gl = ctx.createLinearGradient(0, o[1] * u, 0, (o[1] + 6) * u);
      gl.addColorStop(0, 'rgba(255,255,255,.28)'); gl.addColorStop(.5, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(0,0,0,.18)');
      ctx.fillStyle = gl; ctx.fillRect(o[0] * u, o[1] * u, 6 * u, 6 * u);
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = u * .25; ctx.shadowOffsetY = u * .06;
      rr((o[0] + .9) * u, (o[1] + .9) * u, 4.2 * u, 4.2 * u, .4 * u); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
      SLOT.forEach((sl) => {
        const cx = (o[0] + sl[0]) * u, cy = (o[1] + sl[1]) * u;
        const g = ctx.createRadialGradient(cx, cy - u * .1, u * .05, cx, cy, u * .62);
        g.addColorStop(0, '#fafafa'); g.addColorStop(1, '#d4d4d4');
        ctx.beginPath(); ctx.arc(cx, cy, .6 * u, 0, 7); ctx.fillStyle = g; ctx.fill();
        ctx.lineWidth = u * .08; ctx.strokeStyle = tint(L.COLORS[s], .7); ctx.stroke();
      });
    });
    // outer track
    ctx.lineWidth = Math.max(1, u * .03); ctx.strokeStyle = '#c4c4c4';
    L.TRACK.forEach((c, i) => {
      const s = L.START.indexOf(i);
      ctx.fillStyle = s >= 0 ? L.COLORS[s] : '#fff';
      ctx.fillRect(c[0] * u, c[1] * u, u, u); ctx.strokeRect(c[0] * u, c[1] * u, u, u);
    });
    // coloured home columns
    L.HOME.forEach((h, s) => h.forEach((c) => {
      ctx.fillStyle = L.COLORS[s]; ctx.fillRect(c[0] * u, c[1] * u, u, u); ctx.strokeRect(c[0] * u, c[1] * u, u, u);
    }));
    // stars on safe squares, arrows where each colour turns into its home column
    L.TRACK.forEach((c, i) => {
      if (L.SAFE.has(i)) {
        const isStart = L.START.includes(i);
        star((c[0] + .5) * u, (c[1] + .5) * u, u * .33);
        ctx.fillStyle = isStart ? 'rgba(255,255,255,.9)' : '#e9e9e9'; ctx.fill();
        ctx.lineWidth = u * .03; ctx.strokeStyle = isStart ? 'rgba(0,0,0,.25)' : '#9b9b9b'; ctx.stroke();
      }
    });
    [[0, 7, 1, 0, 0], [7, 0, 0, 1, 1], [14, 7, -1, 0, 2], [7, 14, 0, -1, 3]].forEach((a) =>
      arrow((a[0] + .5) * u, (a[1] + .5) * u, a[2], a[3], L.COLORS[a[4]], u));
    // centre
    const m = 7.5 * u;
    [[[6, 6], [6, 9]], [[6, 6], [9, 6]], [[9, 6], [9, 9]], [[6, 9], [9, 9]]].forEach((e, s) => {
      ctx.beginPath(); ctx.moveTo(e[0][0] * u, e[0][1] * u); ctx.lineTo(e[1][0] * u, e[1][1] * u); ctx.lineTo(m, m); ctx.closePath();
      ctx.fillStyle = L.COLORS[s]; ctx.fill(); ctx.lineWidth = u * .03; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    });
  }

  function mix(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = t < 0 ? 0 : 255, a = Math.abs(t);
    r = Math.round(r + (f - r) * a); g = Math.round(g + (f - g) * a); b = Math.round(b + (f - b) * a);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // A shaded pawn: foot, tapering body, collar and a glossy round head.
  function pawn(x, y, u, col, s) {
    const w = .34 * u * s;
    ctx.beginPath(); ctx.ellipse(x + w * .3, y + .3 * u * s, w * 1.15, w * .42, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.fill();
    let g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, mix(col, -.5)); g.addColorStop(.4, mix(col, .3)); g.addColorStop(1, mix(col, -.6));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, y + .25 * u * s, w, w * .38, 0, 0, 7); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - w * .85, y + .24 * u * s);
    ctx.quadraticCurveTo(x - w * .25, y + .02 * u * s, x - w * .22, y - .17 * u * s);
    ctx.lineTo(x + w * .22, y - .17 * u * s);
    ctx.quadraticCurveTo(x + w * .25, y + .02 * u * s, x + w * .85, y + .24 * u * s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y - .17 * u * s, w * .5, w * .17, 0, 0, 7); ctx.fillStyle = mix(col, .45); ctx.fill();
    const hr = w * .62, hy = y - .34 * u * s;
    g = ctx.createRadialGradient(x - hr * .35, hy - hr * .4, hr * .1, x, hy, hr * 1.05);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.25, mix(col, .35)); g.addColorStop(.75, col); g.addColorStop(1, mix(col, -.55));
    ctx.beginPath(); ctx.arc(x, hy, hr, 0, 7); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = u * .025; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
    // white ring round the head, like a classic board pawn
    ctx.beginPath(); ctx.ellipse(x, hy - hr * .05, hr * .78, hr * .36, 0, 0, 7); ctx.lineWidth = u * .045 * s; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, hy - hr * .05, hr * .3, hr * .14, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  }

  // Where a pawn is drawn: on a square, or part way between two while it walks.
  function posAt(seat, i, v) {
    const a = Math.floor(v), f = v - a;
    const A = tokenPos(seat, i, a);
    if (f < 1e-6) return A;
    const B = tokenPos(seat, i, a + 1);
    return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f];
  }

  // One square at a time, about 7 a second. Going backwards (captured) or leaving base is not a walk.
  function stepVis(dt) {
    [0, 2].forEach((seat) => S.tok[seat].forEach((p, i) => {
      const v = vis[seat][i];
      if (v === p) return;
      if (v === 0 || p < v) vis[seat][i] = p;
      else vis[seat][i] = Math.min(p, v + dt * 0.007);
    }));
  }

  function drawTokens(u, t) {
    const items = [];
    [0, 2].forEach((seat) => S.tok[seat].forEach((p, i) => {
      const v = vis[seat][i];
      items.push({ seat, i, p: Math.abs(v - Math.round(v)) < 1e-6 ? Math.round(v) : -1, v, pos: posAt(seat, i, v) });
    }));
    const groups = {};
    items.forEach((it) => { if (it.p > 0 && it.p < L.DONE) (groups[it.pos.join()] = groups[it.pos.join()] || []).push(it); });
    Object.values(groups).forEach((g) => {
      if (g.length > 1) g.forEach((it, k) => {
        const a = k / g.length * Math.PI * 2;
        it.pos = [it.pos[0] + Math.cos(a) * .22, it.pos[1] + Math.sin(a) * .16]; it.small = true;
      });
    });
    const can = L.movable(S, mySeat);
    items.sort((a, b) => a.pos[1] - b.pos[1]);
    items.forEach((it) => {
      let x = it.pos[0] * u, y = it.pos[1] * u + u * .04;
      if (it.p === -1) y -= Math.sin((it.v % 1) * Math.PI) * u * .22;
      const s = it.small ? .78 : 1;
      if (it.seat === mySeat && can.includes(it.i)) {
        const k = .5 + .5 * Math.sin(t / 160);
        ctx.beginPath(); ctx.ellipse(x, y + .26 * u * s, .42 * u * s + k * u * .06, .17 * u * s + k * u * .03, 0, 0, 7);
        ctx.lineWidth = u * .07; ctx.strokeStyle = '#ffb300'; ctx.stroke();
        y -= k * u * .08;
      }
      pawn(x, y, u, L.COLORS[it.seat], s);
    });
  }

  function fit() {
    const w = Math.round(cv.clientWidth * (window.devicePixelRatio || 1));
    if (w && cv.width !== w) { cv.width = w; cv.height = w; }
  }

  function frame(t) {
    if ($('game').style.display === 'block') {
      fit();
      const u = cv.width / 15;
      stepVis(Math.min(80, t - lastT)); lastT = t;
      drawBoard(u); drawTokens(u, t);
      const tm = $('timer'), tt = $('tt');
      if (deadline && S.winner == null && !S.passing) {
        const left = Math.max(0, deadline - Date.now());
        tm.style.display = 'block'; tt.style.display = 'block';
        tm.firstElementChild.style.width = (left / TURN_MS * 100) + '%';
        tm.classList.toggle('low', left < 3000);
        tt.textContent = (S.turn === mySeat ? 'Your move' : nm(S.turn) + ' is deciding') + ', ' + Math.ceil(left / 1000) + 's';
      } else { tm.style.display = 'none'; tt.style.display = 'none'; }
    }
    requestAnimationFrame(frame);
  }

  cv.addEventListener('pointerdown', (e) => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 15, y = (e.clientY - r.top) / r.height * 15;
    let best = -1, bd = .75;
    L.movable(S, mySeat).forEach((i) => {
      const p = tokenPos(mySeat, i, S.tok[mySeat][i]);
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d < bd) { bd = d; best = i; }
    });
    if (best >= 0) act('move', best);
  });

  $('rollBtn').onclick = () => act('roll');
  $('scene').onclick = () => { if (!$('rollBtn').disabled) act('roll'); };
  $('againBtn').onclick = () => act('again');
  $('copyBtn').onclick = () => {
    const el = $('link'); el.select();
    (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject()).catch(() => document.execCommand('copy'));
    $('copyBtn').textContent = 'Copied'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1500);
  };
  $('waBtn').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent('Come and play Ludo with me: ' + $('link').value), '_blank');
  $('newBtn').onclick = () => { store('ludo-host', undefined); say('Setting up your game...'); startHost(randCode(), null); };
  $('resumeBtn').onclick = () => { const sv = load('ludo-host'); if (sv) { say('Resuming...'); startHost(sv.code, sv.S); } };

  // ---------- boot ----------
  const hash = location.hash.replace('#', '').trim();
  const saved = load('ludo-host');
  if (hash && !(saved && saved.code === hash)) {
    $('newBtn').style.display = 'none'; $('joinBtn').style.display = 'inline-block';
    $('lobby').querySelector('p').textContent = 'You have been invited to a game of Ludo. Enter your name and join.';
    $('joinBtn').onclick = () => startGuest(hash);
  }
  else if (hash && saved && saved.code === hash) { say('Resuming your game...'); startHost(saved.code, saved.S); }
  else if (saved) $('resumeBtn').style.display = 'inline-block';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
